<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Сплавий — металлургическая лаборатория</title>

<style>  /* ===== МОДАЛЬНОЕ ОКНО РЕЦЕПТОВ ===== */
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.72); backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center; z-index:1000;}
  .modal.hidden{display:none;}
  .modal-box{width:min(1100px, 94vw); height:min(760px, 90vh);
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    display:flex; flex-direction:column; overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.6);}
  .modal-head{display:flex; align-items:center; gap:12px; padding:10px 14px;
    border-bottom:1px solid var(--line); background:var(--panel2); flex:none;}
  .modal-head h3{font-size:14px; color:var(--accent2); letter-spacing:1px;}
  .modal-body{display:grid; grid-template-columns: 320px 1fr; flex:1; min-height:0;}

  .recipe-list{overflow-y:auto; border-right:1px solid var(--line); padding:6px;}
  .recipe-item{padding:6px 8px; border-radius:7px; cursor:pointer; font-size:12px;
    border:1px solid transparent; line-height:1.25;}
  .recipe-item:hover{background:var(--panel2); border-color:var(--line);}
  .recipe-item.active{background:#24303d; border-color:var(--accent);}
  .recipe-item small{display:block; color:var(--muted); font-size:10px;}

  .recipe-detail{overflow-y:auto; padding:14px 18px; min-height:0;}
  .recipe-detail .title{font-size:20px; font-weight:700; color:var(--accent2); line-height:1.15;}
  .recipe-detail .sub{font-size:12px; color:var(--muted); margin-bottom:12px;}
  .recipe-detail .badge{display:inline-block; font-size:10px; padding:2px 7px;
    border-radius:6px; background:#0b0e12; color:var(--cool); margin-right:6px; margin-bottom:10px;}

  .recipe-table{width:100%; border-collapse:collapse; font-size:12px; margin:8px 0 14px;}
  .recipe-table th, .recipe-table td{padding:5px 8px; text-align:left;
    border-bottom:1px solid #232b34;}
  .recipe-table th{color:var(--muted); font-weight:500; font-size:10px;
    text-transform:uppercase; letter-spacing:1px;}
  .recipe-table td.num{text-align:right; font-variant-numeric:tabular-nums;}
  .recipe-table tr:hover td{background:#1a2029;}
  .recipe-table .sym{font-weight:700; color:var(--accent2);}
  .recipe-table .base-row td{background:#141a22;}

  .recipe-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:10px;}
  .recipe-note{font-size:11px; color:var(--muted); line-height:1.5; margin-top:10px;
    padding:8px 10px; background:#0b0e12; border-radius:8px; border:1px solid var(--line);}
  :root{
    --bg:#0d0f12; --panel:#161a20; --panel2:#1d232b; --line:#2b333d;
    --text:#e8edf3; --muted:#8b97a6; --accent:#ff8a3d; --accent2:#ffb86b;
    --ok:#3ddc97; --bad:#ff4d6d; --cool:#4db8ff;
  }
  *{box-sizing:border-box; margin:0; padding:0; min-width:0;}
  html,body{height:100%; width:100%; overflow:hidden;}
  body{background:radial-gradient(1200px 800px at 70% -10%, #1a2029 0%, var(--bg) 60%);
    color:var(--text); font-family:"Segoe UI",Roboto,Arial,sans-serif; overflow:hidden;}

  #app{display:grid;
    grid-template-columns: minmax(240px, 300px) 1fr minmax(260px, 320px);
    grid-template-rows: 48px 1fr 120px;
    height:100vh; width:100vw; gap:6px; padding:6px;}

  header{grid-column:1/-1; display:flex; align-items:center; gap:12px; padding:0 12px;
    background:linear-gradient(90deg,#1b212a,#12161c); border:1px solid var(--line);
    border-radius:10px; min-height:0;}
  header h1{font-size:16px; letter-spacing:2px; color:var(--accent2); font-weight:700;}
  header .tag{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .stats{margin-left:auto; display:flex; gap:14px; font-size:11px; color:var(--muted); white-space:nowrap;}
  .stats b{color:var(--text); font-weight:600;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:10px;
    padding:8px; overflow:hidden; display:flex; flex-direction:column; min-height:0;}
  .panel h2{font-size:10px; text-transform:uppercase; letter-spacing:1.2px;
    color:var(--muted); margin-bottom:6px; flex:none;}
  .scroll{overflow-y:auto; overflow-x:hidden; flex:1; min-height:0;}

  #metals{grid-column:1; grid-row:2; min-height:0;}
  .metal{display:grid; grid-template-columns: 34px 1fr auto; gap:8px; align-items:center;
    padding:4px 6px; border-radius:8px; cursor:pointer; border:1px solid transparent; transition:.12s;}
  .metal:hover{background:var(--panel2); border-color:var(--line);}
  .metal .thumb{width:34px; height:34px; border-radius:8px; overflow:hidden; flex:none;
    background-size:cover;
    box-shadow: inset 0 1px 2px rgba(255,255,255,.25), inset 0 -2px 5px rgba(0,0,0,.55);}
  .metal .nm{font-size:12px; line-height:1.15; min-width:0;}
  .metal .nm small{display:block; color:var(--muted); font-size:9px;}
  .metal .tm{font-size:10px; color:var(--muted); text-align:right;}
  .cat-label{font-size:9px; text-transform:uppercase; letter-spacing:1px;
    color:var(--muted); margin:8px 0 3px;}

  #furnace{grid-column:2; grid-row:2; display:flex; flex-direction:column; gap:6px; min-height:0;}
  #stage{flex:1; position:relative; min-height:0;
    background:radial-gradient(circle at 50% 30%, #212a35, #0b0e12);
    border:1px solid var(--line); border-radius:10px; overflow:hidden;}
  canvas{width:100%; height:100%; display:block;}

  #tempHud{position:absolute; top:8px; left:8px; background:rgba(0,0,0,.55);
    border:1px solid var(--line); border-radius:8px; padding:6px 8px;
    font-size:11px; line-height:1.4; backdrop-filter:blur(4px);}
  #tempHud .big{font-size:18px; font-weight:700; color:var(--accent2);}
  #phaseHud{position:absolute; top:8px; right:8px; background:rgba(0,0,0,.55);
    border:1px solid var(--line); border-radius:8px; padding:6px 8px;
    font-size:11px; text-align:right; backdrop-filter:blur(4px);}

  #resultCard{position:absolute; left:50%; bottom:10px; transform:translateX(-50%);
    background:rgba(10,13,17,.82); border:1px solid var(--line); border-radius:12px;
    padding:8px 14px; display:flex; align-items:center; gap:12px;
    backdrop-filter:blur(8px); box-shadow:0 8px 30px rgba(0,0,0,.5);
    transition:opacity .3s; max-width:calc(100% - 20px);}
  #resultCard.hidden{opacity:0; pointer-events:none;}
  #resultCard .preview{width:52px; height:52px; border-radius:10px; overflow:hidden; flex:none;
    background-size:cover;
    box-shadow: inset 0 1px 3px rgba(255,255,255,.25), inset 0 -3px 6px rgba(0,0,0,.6), 0 4px 12px rgba(0,0,0,.5);}
  #resultCard .info{display:flex; flex-direction:column; gap:2px; min-width:0;}
  #resultCard .name{font-size:17px; font-weight:700; color:var(--accent2); line-height:1.1;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #resultCard .sub{font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  #resultCard .tmBadge{font-size:11px; padding:2px 6px; border-radius:6px;
    background:#0b0e12; color:var(--cool); font-weight:600; white-space:nowrap;}

  .controls{flex:none; display:grid; grid-template-columns: 1fr 1fr; gap:6px;}
  .controls .row{display:flex; gap:6px; align-items:center;
    background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:6px;}
  .controls label{font-size:11px; color:var(--muted); white-space:nowrap;}
  .mass-input{width:92px;padding:2px 4px;font-size:11px;background:#0b0e12;
    color:var(--text);border:1px solid var(--line);border-radius:5px;text-align:right;}
  .mass-input.invalid{border-color:var(--bad);}
  .charge-item .frac{font-size:9px;color:var(--muted);margin-left:2px;white-space:nowrap;}
  button{border:none; border-radius:8px; padding:8px 10px; font-size:12px; font-weight:600;
    cursor:pointer; transition:.12s; background:#2a323d; color:var(--text);}
  button:hover{filter:brightness(1.15);}
  .btn-primary{background:linear-gradient(180deg,#ff9a4d,#e8641c); color:#1a0d00;}
  .btn-cast{background:linear-gradient(180deg,#4db8ff,#1d7fc4); color:#001522;}
  .btn-danger{background:linear-gradient(180deg,#ff6b81,#c2183a); color:#fff;}
  .btn-clean{background:#24303d;}

  #right{grid-column:3; grid-row:2; display:flex; flex-direction:column; gap:6px; min-height:0;}

/* Панели «Состав», «Свойства», «Доп. расчёты» — растягиваются,
   получая приоритет по высоте. Шихта и Экспорт — фиксируются по контенту. */
#right #charge   { flex: 0 0 auto; max-height: 26%; }
#right #composition,
#right #props,
#right #advanced { flex: 1 1 0; min-height: 90px; }
#right #exportPanel { flex: 0 0 auto; }
  #right .panel{flex:1; min-height:0;}
  .charge-item{display:flex; justify-content:space-between; align-items:center; gap:6px;
    padding:4px 6px; background:var(--panel2); border:1px solid var(--line);
    border-radius:6px; margin-bottom:4px; font-size:11px;}
  .charge-item .thumb{width:22px; height:22px; border-radius:5px; flex:none; background-size:cover;
    box-shadow: inset 0 1px 2px rgba(255,255,255,.25), inset 0 -2px 4px rgba(0,0,0,.55);}
  .charge-item .x{cursor:pointer; color:var(--bad); font-weight:700; padding:0 3px;}
  .empty{color:var(--muted); font-size:11px; padding:6px; text-align:center;}

  .comp-row{display:flex; flex-direction:column; gap:2px; font-size:11px; margin-bottom:5px;}
  .comp-row .lbl{display:flex; justify-content:space-between;}
  .bar{height:6px; background:#0b0e12; border-radius:3px; overflow:hidden;}
  .bar i{display:block; height:100%;}

  .prop{display:flex; justify-content:space-between; font-size:11px; padding:2px 0;
    border-bottom:1px dashed #232b34;}
  .prop span:last-child{color:var(--accent2); font-weight:600;}
  .prop.name-prop span:last-child{color:var(--cool); font-weight:700; max-width:60%;
    text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  #log{grid-column:1/-1; grid-row:3; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:6px 10px; overflow-y:auto;
    font-family:Consolas,monospace; font-size:11px; line-height:1.45; min-height:0;}
  #log .t{color:var(--muted);}
  #log .ok{color:var(--ok);}
  #log .warn{color:var(--accent2);}
  #log .err{color:var(--bad);}
  #log .cool{color:var(--cool);}
#log{grid-column:1/2; grid-row:3; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:6px 10px; overflow-y:auto;
    font-family:Consolas,monospace; font-size:11px; line-height:1.45; min-height:0;}
  ::-webkit-scrollbar{width:6px; height:6px;}
  ::-webkit-scrollbar-thumb{background:#2b333d; border-radius:3px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width: 1100px){
    #app{grid-template-columns: minmax(200px, 240px) 1fr minmax(220px, 260px);}
    .metal{grid-template-columns: 28px 1fr auto; gap:6px;}
    .metal .thumb{width:28px; height:28px;}
    #resultCard .name{font-size:15px;}
    #resultCard .preview{width:44px; height:44px;}
  }
  @media (max-height: 700px){
    #app{grid-template-rows: 40px 1fr 90px;}
    header h1{font-size:14px;}
    .controls .row{padding:4px;}
    button{padding:6px 8px; font-size:11px;}
    #resultCard{padding:6px 10px; gap:8px;}
    #resultCard .name{font-size:14px;}
    #resultCard .preview{width:40px; height:40px;}
  }
/* Запрет выделения текста и элементов */
*{
  -webkit-user-select: none;   /* Safari, Chrome */
  -moz-user-select: none;      /* Firefox */
  -ms-user-select: none;       /* IE/Edge */
  user-select: none;
  -webkit-touch-callout: none; /* запрет контекстного меню на долгий тап (iOS) */
  -webkit-tap-highlight-color: transparent; /* убрать подсветку тапа */
}

/* Разрешить выделение и ввод там, где это реально нужно */
input, textarea, [contenteditable="true"]{
  -webkit-user-select: text;
  -moz-user-select: text;
  -ms-user-select: text;
  user-select: text;
}

/* Запрет перетаскивания картинок/элементов */
img, canvas, .thumb, .preview{
  -webkit-user-drag: none;
  user-drag: none;
  pointer-events: auto; /* клики оставляем, drag отключаем */
}

/* Запрет зума жестами (pinch) и двойным тапом на мобильных */
html, body{
  touch-action: manipulation;      /* отключает двойной тап-зум, оставляет скролл */
  -ms-touch-action: manipulation;
  overscroll-behavior: none;       /* убирает «оттягивание» страницы */
}

/* Фиксируем масштаб вьюпорта */
@viewport {
  zoom: 1.0;
  width: device-width;
}

#advanced .adv-row{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px dashed #232b34}
#advanced .adv-row span:last-child{color:var(--accent2);font-weight:600;text-align:right;max-width:65%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#advanced .adv-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:6px 0 3px}#right{grid-column:3; grid-row:2; display:flex; flex-direction:column; gap:6px; min-height:0;}

/* Шихта — компактная и сжимаемая */
#right #charge      { flex: 0 1 auto; max-height: 16%; min-height: 56px; }

/* Состав и Свойства — средний вес */
#right #composition,
#right #props       { flex: 1 1 0; min-height: 110px; }

/* Доп. расчёты — двойной вес, забирает основную высоту */
#right #advanced    { flex: 2 1 0; min-height: 180px; }

/* Экспорт — фиксирован по контенту */
#right #exportPanel { flex: 0 0 auto; }#right{grid-column:3; grid-row:2; display:flex; flex-direction:column; gap:6px; min-height:0;}

/* Шихта — заметно больше */
#right #charge      { flex: 2 1 0; min-height: 160px; max-height: 40%; }

/* Состав и Свойства — средний вес */
#right #composition,
#right #props       { flex: 1 1 0; min-height: 100px; }

/* Доп. расчёты — тоже увеличенные */
#right #advanced    { flex: 2 1 0; min-height: 160px; }

/* Экспорт — фиксирован по контенту */
#right #exportPanel { flex: 0 0 auto; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>СПЛАВИЙ</h1>
    <span class="tag">металлургическая лаборатория · 50 металлов · 3396 сплавов</span><button class="btn-clean" id="btnRecipes" style="margin-left:8px">📖 Рецепты</button>
    <div class="stats">
      <div>Печь: <b id="hTemp">20 °C</b></div>
      <div>Тигель: <b id="hMass">0 г</b></div>
      <div>Фаза: <b id="hPhase">—</b></div>
    </div>
  </header>

  <div class="panel" id="metals">
    <h2>Металлы (50)</h2>
    <div class="scroll" id="metalList"></div>
  </div>

  <div id="furnace">
<button class="btn-clean" id="btnHeatTreat">Термообработка</button>
    <div id="stage">
      <canvas id="cv"></canvas>
      <div id="tempHud">
        <div>Температура</div>
        <div class="big"><span id="tempBig">20</span> °C</div>
        <div id="tempSub" style="color:var(--muted);font-size:10px">холодная</div>
      </div>
      <div id="phaseHud">
        <div>Состояние</div>
        <div id="phaseBig" style="font-size:14px;font-weight:700;color:var(--accent2)">—</div>
        <div id="phaseSub" style="color:var(--muted);font-size:10px">тигель пуст</div>
      </div>

      <div id="resultCard" class="hidden">
        <div class="preview" id="resPreview"></div>
        <div class="info">
          <div class="name" id="resName">—</div>
          <div class="sub" id="resSub">—</div>
        </div>
        <div class="tmBadge" id="resTm">—</div>
      </div>
    </div>
    <div class="controls">
      <div class="row">
        <label>Нагрев</label>
        <input type="range" id="heat" min="20" max="3500" value="20" step="5">
        <span id="heatVal" style="width:52px;text-align:right;font-size:11px">20°C</span>
      </div>
      <div class="row">
        <button class="btn-primary" id="btnMelt">Плавить</button>
        <button class="btn-clean" id="btnRefine">Рафин.</button>
        <button class="btn-cast" id="btnCast">Разлить</button>
        <button class="btn-danger" id="btnReset">Сброс</button>
      </div>
    </div>
  </div>

  <div id="right">
    <div class="panel" id="charge">
      <h2>Шихта</h2>
      <div class="scroll" id="chargeList"><div class="empty">Тигель пуст</div></div>
    </div>
    <div class="panel" id="composition">
      <h2>Состав</h2>
      <div class="scroll" id="compList"><div class="empty">Нет данных</div></div>
    </div>
    <div class="panel" id="props">
      <h2>Свойства</h2>
      <div class="scroll" id="propList"><div class="empty">—</div></div>
    </div>
<div class="panel" id="advanced">
  <h2>Доп. расчёты</h2>
  <div class="scroll" id="advList"><div class="empty">—</div></div>
</div>
<div class="panel" id="exportPanel" style="display:none;">

  <div style="display:flex;gap:6px;flex-wrap:wrap;">
    <button class="btn-clean" id="btnExportJSON">JSON</button>
    <button class="btn-clean" id="btnExportCSV">CSV</button>
    <button class="btn-clean" id="btnValidate">Проверить</button>
  </div>
</div>
  </div>

  <div id="log"></div><!-- ===== МОДАЛЬНОЕ ОКНО РЕЦЕПТОВ ===== -->
<!-- ===== МОДАЛЬНОЕ ОКНО РЕЦЕПТОВ ===== -->
<div id="recipeModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head">
      <h3>Рецепты сплавов <span id="recipeCount" style="color:var(--muted);font-weight:400"></span></h3>
      <input type="text" id="recipeSearch" placeholder="Поиск по названию, типу, основе…"
             style="flex:1;max-width:340px;padding:6px 10px;font-size:12px;background:#0b0e12;
                    color:var(--text);border:1px solid var(--line);border-radius:8px">
      <button class="btn-danger" id="recipeClose">✕</button>
    </div>
    <div class="modal-body">
      <div id="recipeList" class="recipe-list"></div>
      <div id="recipeDetail" class="recipe-detail">
        <div class="empty">Выберите сплав слева</div>
      </div>
    </div>
  </div>
</div>
</div>

<script>
/* ============================================================
   1. ДАННЫЕ: 50 МЕТАЛЛОВ
   ============================================================ */
const METALS = [
  {sym:"Al", name:"Алюминий",  tm:660,  rho:2.70, base:"#c7d0d8", hi:"#eef4f8", lo:"#7d878f", pat:"#9aa4ac", rough:.28, grain:.5, spec:.9,  cat:"Лёгкие"},
  {sym:"Mg", name:"Магний",    tm:650,  rho:1.74, base:"#d3d6d0", hi:"#f5f7f2", lo:"#8b8e86", pat:"#aeb1a8", rough:.45, grain:.7, spec:.5,  cat:"Лёгкие"},
  {sym:"Ti", name:"Титан",     tm:1668, rho:4.51, base:"#b6bcc2", hi:"#e2e6ea", lo:"#6e747a", pat:"#8f959b", rough:.35, grain:.6, spec:.7,  cat:"Лёгкие"},
  {sym:"Be", name:"Бериллий",  tm:1287, rho:1.85, base:"#cfd5c8", hi:"#f0f4ea", lo:"#8f948a", pat:"#a8ada0", rough:.5,  grain:.7, spec:.45, cat:"Лёгкие"},
  {sym:"Li", name:"Литий",     tm:180,  rho:0.53, base:"#e0dcc0", hi:"#f8f4d8", lo:"#9b977c", pat:"#b8b498", rough:.55, grain:.6, spec:.35, cat:"Лёгкие"},
  {sym:"Na", name:"Натрий",    tm:98,   rho:0.97, base:"#e8e2b8", hi:"#faf6d0", lo:"#a8a078", pat:"#c0b890", rough:.6,  grain:.5, spec:.3,  cat:"Лёгкие"},
  {sym:"K",  name:"Калий",     tm:63,   rho:0.86, base:"#e4dca8", hi:"#f8f0c0", lo:"#a89e68", pat:"#c0b880", rough:.6,  grain:.5, spec:.3,  cat:"Лёгкие"},

    Ce: ["La","Nd","Pr","Fe","Ni","Co","Cu","Al","Mg","Sm","Gd","Dy","Er","Yb","Lu","Sc","Y","Ti","Zr","Hf","Nb","Ta","V","Cr","W","Mo","Re","Be","Ca","Sr","Ba"],

  };

  // Фильтруем: только существующие в METALS символы, базы — тоже
  const leghPool = {};
  Object.keys(rawPool).forEach(base => {
    if (!byBase[base]) return;
    const filtered = rawPool[base].filter(sym => byBase[sym] && sym !== base);
    if (filtered.length) leghPool[base] = filtered;
  });

  const categories = {

    Pt: ["Драгоценный сплав","Благородный тугоплавкий сплав","Катализаторный сплав"],
    Pd: ["Драгоценный сплав","Катализаторный сплав"],

    Nb: ["Тугоплавкий сплав","Сверхпроводящий сплав"],
    Ta: ["Тугоплавкий сплав","Конденсаторный сплав"],
    Zr: ["Тугоплавкий сплав","Ядерный сплав"],
    Hf: ["Тугоплавкий сплав","Ядерный сплав"],
    Cr: ["Тугоплавкий сплав","Жаростойкий сплав"],

    Gd: ["Магнитный сплав","РЗМ-сплав"],
    Th: ["Редкие","Ядерный сплав"],
    U:  ["Редкие","Ядерный сплав"],
  };

  const prefixes = [
    "Сплав","Марка","Композит","Спецсплав","Экспериментальный","Опытный","Лабораторный",
    "Термостойкий","Коррозионностойкий","Высокопрочный","Жаростойкий","Криогенный",
    "Износостойкий","Ударопрочный","Радиационностойкий","Магнитный","Немагнитный",
    "Электротехнический","Прецизионный","Биосовместимый","Лёгкий","Тяжёлый",
    "Антифрикционный","Конструкционный","Инструментальный","Быстрорежущий",
    "Штамповый","Пружинный","Сварочный","Наплавный","Порошковый","Литейный",
    "Деформируемый","Гранулированный","Монокристаллический","Нанокристаллический",
    "Аморфный","Эвтектический","Композиционный","Армированный"
  ];
  const suffixes = [
    "-М","-Т","-Л","-Н","-В","-Э","-У","-П","-С","-К","-Р","-Б","-Д","-Ж","-З","-И",
    "-О","-Ф","-Х","-Ц","-Ч","-Ш","-Щ","-Ю","-Я","-А","-Г","-Е","-Ё","-Й","-Ъ","-Ы","-Ь"
  ];

  const bases = Object.keys(leghPool);
  let made = 0;
  let guard = 0;
  const MAX_GUARD = 2000000;

  while (made < TARGET && guard < MAX_GUARD){
    guard++;
    const base = bases[(Math.random() * bases.length) | 0];
    const pool = leghPool[base];

    // 1..7 легирующих
    const k = 1 + ((Math.random() * 7) | 0);
    const chosen = [];
    const tmp = pool.slice();
    for (let i = 0; i < k && tmp.length; i++){
      const idx = (Math.random() * tmp.length) | 0;
      chosen.push(tmp.splice(idx, 1)[0]);
    }
    if (!chosen.length) continue;

    // база 30..92%, остальное — легирующие
    const basePct = 30 + Math.random() * 62;
    const remaining = 100 - basePct;
    const weights = chosen.map(() => 0.2 + Math.random() * 2);
    const wSum = weights.reduce((a, b) => a + b, 0);
    const parts = weights.map(w => (w / wSum) * remaining);

    const rules = {};
    rules[base] = [
      Math.max(3, Math.round(basePct - 10)),
      Math.min(99.5, Math.round(basePct + 10))
    ];
    chosen.forEach((sym, i) => {
      const p = Math.max(0.01, parts[i]);
      // для очень малых добавок допускаем узкий диапазон
      const span = Math.max(0.3, p * 0.8);
      const min = Math.max(0.01, +(p - span).toFixed(2));
      const max = +(p + span).toFixed(2);
      rules[sym] = [min, max];
    });

    const key = base + "|" + JSON.stringify(rules);
    if (usedRules.has(key)) continue;

    // уникальное имя — комбинация префикса, базы, 2-3 легирующих, номера, суффикса
    let name;
    let tries = 0;
    do {
      const pfx = prefixes[(Math.random() * prefixes.length) | 0];
      const sfx = Math.random() < 0.7 ? suffixes[(Math.random() * suffixes.length) | 0] : "";
      const num = 1000 + ((Math.random() * 9000) | 0);
      const legPart = chosen.slice(0, 1 + ((Math.random() * Math.min(3, chosen.length)) | 0)).join("");
      name = `${pfx} ${base}${legPart}-${num}${sfx}`;
      tries++;
      if (tries > 200){
        // аварийный уникализатор
        name = `${pfx} ${base}${legPart}-${made + 10000}${sfx}`;
        break;
      }
    } while (usedNames.has(name));
    if (usedNames.has(name)) continue;

    const m1 = byBase[base];
    const m2 = byBase[chosen[0]];
    const mix = (c1, c2) => {
      const r = (parseInt(c1.slice(1,3),16) + parseInt(c2.slice(1,3),16)) >> 1;
      const g = (parseInt(c1.slice(3,5),16) + parseInt(c2.slice(3,5),16)) >> 1;
      const b = (parseInt(c1.slice(5,7),16) + parseInt(c2.slice(5,7),16)) >> 1;
      return "#" + [r,g,b].map(v => v.toString(16).padStart(2,"0")).join("");
    };

    const cats = categories[base] || ["Специальный сплав"];
    const cat = cats[(Math.random() * cats.length) | 0];

    ALLOYS.push({ name, base, rules, color: mix(m1.base, m2.base), cat });
    usedNames.add(name);
    usedRules.add(key);
    made++;

    // прогресс в консоль каждые 500
    if (made % 500 === 0) console.log(`[Сплавий] …${made}/${TARGET}`);
  }

  console.log(`[Сплавий] Сгенерировано ${made} новых сплавов. Всего: ${ALLOYS.length}`);
  if (made < TARGET) {
    console.warn(`[Сплавий] Не удалось достичь ${TARGET} — сгенерировано ${made}. Увеличьте пул легирующих или MAX_GUARD.`);
  }
})();

/* ============================================================
   3. ОПРЕДЕЛЕНИЕ НАЗВАНИЯ СПЛАВА
   ============================================================ */
function identifyAlloy(comp){
  if (!comp.length) return null;
  if (comp.length === 1){
    const m = metalBySym(comp[0].sym);
    return {name:m.name, cat:"Чистый металл", known:true, sym:m.sym};
  }
  const pct = {};
  comp.forEach(c => pct[c.sym] = c.pct);
  const base = comp[0].sym;

  // Сначала — точные попадания (наибольшая специфичность)
  const matches = [];
  for (const a of ALLOYS){
    if (a.base !== base) continue;
    let ok = true;
    for (const [sym, [min, max]] of Object.entries(a.rules)){
      let p = pct[sym];
      if (p === undefined){
        if (a.virtual && a.virtual[sym] !== undefined) p = a.virtual[sym];
        else { ok = false; break; }
      }
      if (p < min || p > max){ ok = false; break; }
    }
    if (!ok) continue;
    const allowed = new Set(Object.keys(a.rules));
    if (a.virtual) Object.keys(a.virtual).forEach(s => allowed.add(s));
    let extra = false;
    for (const c of comp){
      if (!allowed.has(c.sym) && c.pct > 3){ extra = true; break; }
    }
    if (extra) continue;
    // Специфичность = число правил (чем больше, тем точнее)
    matches.push({a, spec: Object.keys(a.rules).length});
  }
  if (matches.length){
    matches.sort((x,y) => y.spec - x.spec);
    const best = matches[0].a;
    return {name:best.name, cat:best.cat, known:true, sym:best.base, color:best.color};
  }

  // Неизвестный сплав — генерируем название
  const baseMetal = metalBySym(base);
  const legh = comp.slice(1).filter(c => c.pct >= 2).map(c => metalBySym(c.sym).name.toLowerCase());
  let name;
  if (legh.length === 0) name = `${baseMetal.name} (с микродобавками)`;
  else if (legh.length === 1) name = `${baseMetal.name}-${legh[0]} сплав`;
  else name = `${baseMetal.name}-${legh.slice(0,2).join("-")} сплав`;
  name = name.charAt(0).toUpperCase() + name.slice(1);
  return {name, cat:"Нестандартный сплав", known:false, sym:base, color:baseMetal.base};
}

/* ============================================================
   5. ТЕКСТУРЫ
   ============================================================ */
function makeMetalTexture(metal, size=64){
  const c = document.createElement("canvas");
  c.width = c.height = size;
  const g = c.getContext("2d");
  const {base, hi, lo, pat, rough, grain, spec} = metal;
  const grad = g.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, hi); grad.addColorStop(0.35, base);
  grad.addColorStop(0.75, base); grad.addColorStop(1, lo);
  g.fillStyle = grad; g.fillRect(0, 0, size, size);

  const img = g.getImageData(0, 0, size, size);
  const d = img.data;
  const amp = 8 + grain * 26;
  for (let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*amp;
    d[i]=clamp(d[i]+n); d[i+1]=clamp(d[i+1]+n); d[i+2]=clamp(d[i+2]+n);
  }
  g.putImageData(img, 0, 0);

  g.globalAlpha = 0.12 + rough*0.22;
  for (let i=0;i<40;i++){
    const x = Math.random()*size, y = Math.random()*size;
    const r = 1 + Math.random()*3;
    g.fillStyle = Math.random() > 0.5 ? hi : lo;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;

  g.globalAlpha = 0.16 + rough*0.18;
  for (let i=0;i<12;i++){
    const x = Math.random()*size, y = Math.random()*size;
    const r = 3 + Math.random()*9;
    const gg = g.createRadialGradient(x,y,0,x,y,r);
    gg.addColorStop(0, pat); gg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gg;
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;

  g.strokeStyle = "rgba(255,255,255,0.16)";
  g.lineWidth = 0.5;
  for (let i=0;i<8;i++){
    g.beginPath();
    const x1 = Math.random()*size, y1 = Math.random()*size;
    const a = Math.random()*Math.PI*2;
    const len = 6 + Math.random()*size*0.45;
    g.moveTo(x1,y1);
    g.lineTo(x1+Math.cos(a)*len, y1+Math.sin(a)*len);
    g.stroke();
  }

  const hg = g.createRadialGradient(size*0.28, size*0.22, 1, size*0.28, size*0.22, size*0.55);
  hg.addColorStop(0, `rgba(255,255,255,${0.5*spec})`);
  hg.addColorStop(0.25, `rgba(255,255,255,${0.15*spec})`);
  hg.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = hg; g.fillRect(0,0,size,size);

  const eg = g.createRadialGradient(size/2,size/2,size*0.25,size/2,size/2,size*0.75);
  eg.addColorStop(0, "rgba(0,0,0,0)");
  eg.addColorStop(1, "rgba(0,0,0,0.4)");
  g.fillStyle = eg; g.fillRect(0,0,size,size);
  return c;
}
const texCache = new Map();
function getMetalTexture(sym, size=64){
  const key = sym + "@" + size;
  if (!texCache.has(key)) texCache.set(key, makeMetalTexture(metalBySym(sym), size));
  return texCache.get(key);
}
const texURL = new Map();
function getMetalURL(sym, size=64){
  const key = sym + "@" + size;
  if (!texURL.has(key)) texURL.set(key, getMetalTexture(sym, size).toDataURL());
  return texURL.get(key);
}

function makeAlloyTexture(comp, size=96){
  const id = identifyAlloy(comp);
  let baseColor;
  if (id && id.color){ baseColor = id.color; }
  else {
    let r=0,g=0,b=0;
    comp.forEach(c => {
      const m = metalBySym(c.sym);
      r += parseInt(m.base.slice(1,3),16) * c.pct/100;
      g += parseInt(m.base.slice(3,5),16) * c.pct/100;
      b += parseInt(m.base.slice(5,7),16) * c.pct/100;
    });
    baseColor = `rgb(${r|0},${g|0},${b|0})`;
  }
  const cvs = document.createElement("canvas");
  cvs.width = cvs.height = size;
  const g = cvs.getContext("2d");
  let R,G,B;
  if (baseColor.startsWith("rgb")){
    const m = baseColor.match(/\d+/g); [R,G,B] = m.map(Number);
  } else {
    R = parseInt(baseColor.slice(1,3),16);
    G = parseInt(baseColor.slice(3,5),16);
    B = parseInt(baseColor.slice(5,7),16);
  }
  const hi = `rgb(${clamp(R+60)},${clamp(G+60)},${clamp(B+60)})`;
  const lo = `rgb(${clamp(R-70)},${clamp(G-70)},${clamp(B-70)})`;
  const grad = g.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, hi);
  grad.addColorStop(0.35, `rgb(${R},${G},${B})`);
  grad.addColorStop(0.8, `rgb(${clamp(R-30)},${clamp(G-30)},${clamp(B-30)})`);
  grad.addColorStop(1, lo);
  g.fillStyle = grad; g.fillRect(0, 0, size, size);

  const img = g.getImageData(0, 0, size, size);
  const d = img.data;
  for (let i=0;i<d.length;i+=4){
    const n = (Math.random()-0.5)*30;
    d[i]=clamp(d[i]+n); d[i+1]=clamp(d[i+1]+n); d[i+2]=clamp(d[i+2]+n);
  }
  g.putImageData(img, 0, 0);

  g.globalAlpha = 0.14;
  for (let i=0;i<60;i++){
    const x = Math.random()*size, y = Math.random()*size;
    const r = 1.5 + Math.random()*5;
    g.fillStyle = Math.random() > 0.5 ? hi : lo;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;

  g.globalAlpha = 0.15;
  for (let i=0;i<15;i++){
    const x = Math.random()*size, y = Math.random()*size;
    const r = 4 + Math.random()*10;
    const gg = g.createRadialGradient(x,y,0,x,y,r);
    gg.addColorStop(0, Math.random()>0.5 ? hi : lo);
    gg.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gg;
    g.beginPath(); g.arc(x,y,r,0,Math.PI*2); g.fill();
  }
  g.globalAlpha = 1;

  g.strokeStyle = "rgba(255,255,255,0.18)"; g.lineWidth = 0.5;
  for (let i=0;i<10;i++){
    g.beginPath();
    const x1 = Math.random()*size, y1 = Math.random()*size;
    const a = Math.random()*Math.PI*2;
    const len = 6 + Math.random()*size*0.5;
    g.moveTo(x1,y1);
    g.lineTo(x1+Math.cos(a)*len, y1+Math.sin(a)*len);
    g.stroke();
  }

  const hg = g.createRadialGradient(size*0.28, size*0.22, 1, size*0.28, size*0.22, size*0.55);
  hg.addColorStop(0, "rgba(255,255,255,0.55)");
  hg.addColorStop(0.25, "rgba(255,255,255,0.16)");
  hg.addColorStop(1, "rgba(255,255,255,0)");
  g.fillStyle = hg; g.fillRect(0,0,size,size);

  const eg = g.createRadialGradient(size/2,size/2,size*0.25,size/2,size/2,size*0.75);
  eg.addColorStop(0, "rgba(0,0,0,0)");
  eg.addColorStop(1, "rgba(0,0,0,0.4)");
  g.fillStyle = eg; g.fillRect(0,0,size,size);
  return cvs;
}

function mixBaseColor(){
  const comp = composition();
  if (!comp.length) return {r:58,g:68,b:80};
  let r=0,gg=0,b=0;
  comp.forEach(c => {
    const m = metalBySym(c.sym);
    r += parseInt(m.base.slice(1,3),16) * c.pct/100;
    gg += parseInt(m.base.slice(3,5),16) * c.pct/100;
    b += parseInt(m.base.slice(5,7),16) * c.pct/100;
  });
  return {r:r|0,g:gg|0,b:b|0};
}

function addToCharge(sym, mass = 100){
  if (S.casted){ log("Слиток уже отлит. Сбросьте печь.", "warn"); return; }
  if (S.melted){ log("Расплав уже готов. Нельзя менять шихту.", "warn"); return; }

  let v = parseMass(mass);
  if (v === null || v <= 0){
    log("Масса должна быть положительным числом или дробью.", "err");
    return;
  }
  if (v > 100000){
    log("Слишком большая масса (макс. 100 000 г).", "err");
    return;
  }
  v = Math.round(v * 1000) / 1000;

  const existing = S.charge.find(c => c.sym === sym);
  if (existing) existing.mass += v;
  else S.charge.push({sym, mass: v});

  log(`Добавлено: ${metalBySym(sym).name} +${v} г`, "ok");
  recalcAll();
}
function removeFromCharge(sym){
  if (S.melted){ log("Нельзя убирать компонент из расплава.", "warn"); return; }
  S.charge = S.charge.filter(c => c.sym !== sym);
  recalcAll();
}

/* Парсер массы: "100", "2.5", "1/3", "2/7", "1 1/2" */
function parseMass(str){
  if (str === null || str === undefined) return null;
  let s = String(str).trim().replace(",", ".").replace(/\s+/g, " ");
  if (!s) return null;
  // смешанная дробь "1 1/2"
  let m = s.match(/^(-?\d+)\s+(\d+)\s*\/\s*(\d+)$/);
  if (m){
    const whole = +m[1], num = +m[2], den = +m[3];
    if (!den) return null;
    return whole >= 0 ? whole + num/den : whole - num/den;
  }
  // простая дробь "1/3"
  m = s.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(-?\d+(?:\.\d+)?)$/);
  if (m){
    const num = +m[1], den = +m[2];
    if (!den) return null;
    return num / den;
  }
  // обычное число
  if (!/^-?\d+(?:\.\d+)?$/.test(s)) return null;
  return +s;
}

function totalMass(){ return S.charge.reduce((a,c)=>a+c.mass,0); }
function composition(){
  const t = totalMass();
  if (!t) return [];
  return S.charge.map(c => ({...c, pct: c.mass / t * 100})).sort((a,b)=>b.pct-a.pct);
}

// Инвариантные точки для ключевых бинарных систем (T, °C)
// liquid = состав жидкости в точке, wt%
const INVARIANTS = {
  "Cu-Zn": { T: 903, type: "peritectic", liquid: { Zn: 72 } },
  "Cu-Sn": { T: 227, type: "eutectic", liquid: { Sn: 99 } },
  "Al-Si": { T: 577, type: "eutectic", liquid: { Si: 12.5 } },
  "Fe-C":  { T: 1147, type: "eutectic", liquid: { C: 4.3 } },
  "Ti-Al": { T: 1460, type: "peritectic" },
  "Ni-Cr": { T: 1345, type: "eutectic", liquid: { Cr: 47 } },
  "W-Co":  { T: 1450, type: "eutectic", liquid: { Co: 40 } },
};

function alloyTm(){
  const comp = composition();
  if (!comp.length) return 20;

  // 1. Средневзвешенная T плавления
  let tw = 0;
  comp.forEach(c => tw += metalBySym(c.sym).tm * c.pct / 100);

  const n = comp.length;
  if (n === 1) return tw;

  // 2. Эвтектический провал: чем больше компонентов, тем ниже
  //    (экспоненциальное насыщение, чтобы не уходить в минус)
  const eutecticDrop = 0.30 * (1 - Math.exp(-(n - 1) * 1.0));

  // 3. Проверка на известные бинарные инварианты
  let floorT = 20;
  for (const c of comp) {
    if (c.pct < 5) continue;
    const base = comp[0].sym;
    const key1 = `${base}-${c.sym}`;
    const key2 = `${c.sym}-${base}`;
    const inv = INVARIANTS[key1] || INVARIANTS[key2];
    if (inv) {
      // Если состав близок к эвтектическому — температура не может быть выше T_эвт
      if (inv.liquid) {
        for (const [sym, target] of Object.entries(inv.liquid)) {
          const actual = comp.find(x => x.sym === sym)?.pct || 0;
          if (Math.abs(actual - target) < 15) {
            floorT = Math.max(floorT, inv.T * 0.85);
          }
        }
      }
    }
  }

  // 4. Нижняя граница: не ниже самой легкоплавкой компоненты (но не ниже эвтектики)
  const minTm = Math.min(...comp.map(c => metalBySym(c.sym).tm));
  const lowerBound = Math.max(floorT, minTm * 0.4);

  const tmCalc = tw * (1 - eutecticDrop);
  return Math.max(20, Math.max(lowerBound, tmCalc));
}

function scheilProfile(comp, steps = 25) {
  if (!comp.length) return [];
  const profile = [];
  for (let i = 0; i <= steps; i++) {
    const fs = i / steps;  // доля твёрдой фазы
    const solid = comp.map(c => {
      const k = K_SCHEIL[c.sym] ?? 0.7;
      // Scheil: C_s = k * C_0 * (1 - fs)^(k-1)
      const pct = c.pct * k * Math.pow(Math.max(0.01, 1 - fs), k - 1);
      return { sym: c.sym, pct: Math.min(100, pct) };
    });
    // Нормируем на 100%
    const sum = solid.reduce((a, x) => a + x.pct, 0);
    if (sum > 0) solid.forEach(x => x.pct = x.pct / sum * 100);
    profile.push({ fs, solid });
  }
  return profile;
}

function Ac3(C){
  // линейная аппроксимация от 912 (0%C) до 727 (0.8%C)
  return 912 - (912 - 727) * (C / 0.8);
}
// A1 — эвтектоид (727°C)
function A1(){ return 727; }

function Acm(C){
  // от 727 при 0.8%C до 1147 при 2.14%C
  return 727 + (1147 - 727) * ((C - 0.8) / (2.14 - 0.8));

// Ликвидус Fe-C
function FeC_liquidus(C){
  if (C <= 4.3) return 1538 - (1538 - 1147) * (C / 4.3);
  return 1147 + (1538 - 1147) * ((C - 4.3) / (6.67 - 4.3));
}
// Солидус Fe-C
function FeC_solidus(C){
  if (C <= 2.14) return 1538 - (1538 - 1147) * (C / 2.14);

function feC_phases(C_pct, T_C){
  const C = Math.max(0, Math.min(6.67, C_pct));
  const out = {phases:[], T:T_C, C};
  const Tl = FeC_liquidus(C);
  const Ts = FeC_solidus(C);
  if (T_C >= Tl){ out.phases.push("Жидкость"); return out; }
  if (T_C >= Ts){
    out.phases.push("Жидкость + Аустенит");
    return out;
  }
  if (C < 0.02){
    if (T_C < 912) out.phases.push("Феррит");
    else out.phases.push("Аустенит");
    return out;
  }
  if (C < 0.8){
    if (T_C >= Ac3(C)) out.phases.push("Аустенит");
    else if (T_C >= A1()){
      const fA = (T_C - A1()) / (Ac3(C) - A1());
      out.phases.push("Феррит + Аустенит", `f_A≈${(fA*100).toFixed(0)}%`);
    } else {
      // ниже A1 — феррит + перлит
      const fP = C / 0.8 * 100;
      out.phases.push(`Феррит + Перлит`, `Перлит≈${fP.toFixed(0)}%`);
    }
    return out;
  }
  if (C <= 2.14){
    if (T_C >= Acm(C)) out.phases.push("Аустенит");
    else if (T_C >= A1()) out.phases.push("Аустенит + Цементит");
    else out.phases.push("Перлит + Цементит");
    return out;
  }
  // чугуны
  if (T_C >= 1147) out.phases.push("Жидкость + Аустенит");
  else if (T_C >= 727) out.phases.push("Аустенит + Ледебурит");
  else out.phases.push("Перлит + Ледебурит");
  return out;
}


/* ============================================================
   ПРИБЫЛИ И ЛИТНИКОВАЯ СИСТЕМА
   ============================================================ */
function riserDesign(mass_g, modul = "sphere"){
  const sh = shrinkage();
  const volCav = shrinkageCavity(mass_g, sh.vol);
  // Модуль охлаждения M = V/A
  // Для отливки массой m (ρ≈8) — сфера/цилиндр/плита
  const rho = 8e-3; // кг/см³ -> 8 г/см³
  const V = mass_g / 8; // см³
  let M;
  if (modul === "sphere"){
    const r = Math.cbrt(3*V/(4*Math.PI));
    M = r / 3;
  } else if (modul === "cylinder"){
    const r = Math.cbrt(V / (Math.PI * 2)); // H=2r
    M = (r * 2) / 6; // V/A для цилиндра H=2R
  } else {
    M = V / (2 * Math.sqrt(V)); // грубо
  }
  // Прибыль: диаметр ~2.5..3 M, высота ~1.5 D
  const D = Math.max(2, M * 6);
  const Hr = D * 1.5;
  const volRiser = Math.PI * (D/2)**2 * Hr;
  return {M:+M.toFixed(2), D:+D.toFixed(2), H:+Hr.toFixed(2),
          volCavity:+volCav.toFixed(2), volRiser:+volRiser.toFixed(2)};
}

/* ============================================================
   ПРАВИЛО ЛЕ ШАТЕЛЬЕ
   Влияние T на растворимость: растворимость обычно растёт с T
   (для большинства металлов). Проверяем по справочным данным.
   ============================================================ */
// Приближённая растворимость элемента в основе в зависимости от T
// S(T) = S0 * exp(-ΔH/(R*T))
function solubility(symBase, symSol, T_C, S0 = 1.0, dH = 20){
  const T_K = T_C + 273.15;
  return S0 * Math.exp(-dH*1000/(R_GAS*T_K));
}
// Ле Шателье: сдвиг равновесия при изменении T
function leChatelier(tempDir){
  // tempDir: +1 нагрев, -1 охлаждение
  return tempDir > 0
    ? "Нагрев → равновесие смещается в сторону эндотермической реакции (плавление, растворение)"
    : "Охлаждение → равновесие смещается в сторону экзотермической реакции (кристаллизация, выделение фаз)";
}

function buildReport(){
  const comp = composition();
  const id = identifyAlloy(comp);
  const p = alloyProps();
  const tp = alloyThermophys();
  const mag = magneticProps();
  const sh = shrinkage();
  const riser = p ? riserDesign(p.mass) : null;
  return {
    timestamp: new Date().toISOString(),
    state: {
      temp: S.temp, melted: S.melted, refined: S.refined, casted: S.casted,
      totalMass: totalMass(),
    },
    composition: comp,
    alloy: id,
    props: p,
    thermophys: tp,
    magnetic: mag,
    shrinkage: sh,
    riser,
    phases: currentPhases(),
    gibbs: gibbsFreedom(comp.length, currentPhases()),
    intermetallics: intermetallics().slice(0, 10),
    deoxidation: deoxidation(S.temp || 1600).slice(0, 5),
  };
}
function exportJSON(){
  const data = buildReport();
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
  downloadBlob(blob, `splaviy-report-${Date.now()}.json`);
  log("Отчёт JSON сохранён.", "cool");
}
function exportCSV(){
  const rows = [["Параметр","Значение"]];
  const rep = buildReport();
  rows.push(["Температура, °C", rep.state.temp]);
  rows.push(["Масса, г", rep.state.totalMass]);
  if (rep.alloy){
    rows.push(["Название", rep.alloy.name]);
    rows.push(["Тип", rep.alloy.cat]);
  }
  if (rep.props){
    Object.entries(rep.props).forEach(([k,v]) => {
      if (v && typeof v === "object") rows.push([k, JSON.stringify(v)]);
      else rows.push([k, v]);

  rep.composition.forEach(c => rows.push([`Состав ${c.sym}, %`, c.pct.toFixed(3)]));
  const csv = rows.map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob([csv], {type:"text/csv"});
  downloadBlob(blob, `splaviy-report-${Date.now()}.csv`);

function downloadBlob(blob, name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

/* ============================================================
   ВАЛИДАЦИЯ СОСТАВА
   ============================================================ */
function validateComposition(){
  const comp = composition();
  const warns = [];
  if (!comp.length){ warns.push("Тигель пуст."); return warns; }
  const sum = comp.reduce((a,c)=>a+c.pct,0);
  if (Math.abs(sum - 100) > 0.5) warns.push(`Сумма процентов = ${sum.toFixed(2)}% (должна быть 100%).`);
  if (comp.length === 1) warns.push("Чистый металл — сплав не образуется.");
  // проверка физических пределов растворимости
  const base = comp[0].sym;
  comp.forEach(c => {
    if (c.sym === base) return;
    if (c.pct > 50) warns.push(`${c.sym} ${c.pct.toFixed(1)}% — очень высокая концентрация (возможна нерастворимость).`);
    if (c.pct < 0.01) warns.push(`${c.sym} ${c.pct.toFixed(4)}% — следы, вклад в свойства мал.`);
  });
  // проверка на хрупкость
  const p = alloyProps();
  if (p && p.ductility < 3) warns.push("Пластичность < 3% — высокий риск хрупкого разрушения.");
  if (p && p.hardness > 90) warns.push("Твёрдость > 90 HV — вероятно, инструментальный/хрупкий сплав.");
  // интерметаллиды
  const im = intermetallics();
  if (im.length && im[0].tm > alloyTm() * 1.2)
    warns.push(`Возможен интерметаллид ${im[0].A}-${im[0].B} с Tпл≈${im[0].tm}°C выше ликвидуса сплава.`);
  return warns;
}
// Краткая сводка ликвации: насколько обогащается остаточный расплав
function segregationSummary(comp) {
  if (!comp.length) return null;
  const prof = scheilProfile(comp, 10);
  const last = prof[prof.length - 1].solid;
  const enriched = last
    .map(x => {
      const orig = comp.find(c => c.sym === x.sym)?.pct || 0;
      return { sym: x.sym, orig, final: x.pct, ratio: orig > 0 ? x.pct / orig : 1 };
    })
    .filter(x => x.ratio > 1.5)
    .sort((a, b) => b.ratio - a.ratio);
  return { profile: prof, enriched };
}


function alloyDensity(){
  const comp = composition();
  if (!comp.length) return 0;
  let inv = 0;
  comp.forEach(c => inv += (c.pct/100) / metalBySym(c.sym).rho);
  return 1/inv;
}/* ============================================================
   ФИЗИКА: свойства через аддитивную модель упрочнения
   ============================================================ */

// Коэффициенты твёрдорастворного упрочнения a_i (МПа / (wt%)^0.5)
// Для никелевых сплавов — из литературы, для остальных — приближённые
const SS_COEFF = {
  // Ni-сплавы (сильные упрочнители)
  Al: 225, Ti: 775, Cr: 337, Mo: 1015, Fe: 153, Mn: 448, Si: 275,
  Nb: 600, Ta: 500, W: 800, Co: 100, Cu: 80,
  // Fe-сплавы (C через карбиды — отдельно)
  C:  1200, // эффективный, через перлит/карбиды
  // Al-сплавы
  Mg: 120, Zn: 80, Cu: 100,
  // Общие
  default: 100,
};

// σ_0 — сопротивление решётки (МПа), грубо по основе
const SIGMA0 = { Fe: 70, Ni: 60, Cu: 40, Al: 30, Ti: 50, Co: 70, Mg: 25, default: 50 };

// k_H — коэффициент Холла-Петча (МПа·√μm)
const KH = { Fe: 600, Ni: 400, Cu: 300, Al: 200, Ti: 350, Co: 450, Mg: 250, default: 350 };

function alloyProps(){
  const comp = composition();
  if (!comp.length) return null;

  const tm = alloyTm();
  const rho = alloyDensity();
  const n = comp.length;
  const base = comp[0].sym;

  // ---- 1. Твёрдый раствор: Σ a_i * c_i^0.5 ----
  let sigmaSS = 0;
  comp.forEach(c => {
    if (c.sym === base) return;
    const a = SS_COEFF[c.sym] ?? SS_COEFF.default;
    sigmaSS += a * Math.sqrt(c.pct);
  });

  // ---- 2. Зерно: Холл-Петч, k_H / sqrt(d) ----
  // Оценка размера зерна из температуры разливки (перегрев → крупное зерно)
  // d в μm: чем выше перегрев над ликвидусом, тем крупнее
  const superheat = Math.max(0, S.temp - tm);
  const dGrain = Math.max(15, 50 + superheat * 0.8);  // 15–300 μm
  const kH = KH[base] ?? KH.default;
  const sigmaGrain = kH / Math.sqrt(dGrain);

  // ---- 3. Итоговая прочность ----
  const sigma0 = SIGMA0[base] ?? SIGMA0.default;
  const sigmaY = Math.round(sigma0 + sigmaSS + sigmaGrain);

  // ---- 4. Твёрдость: HV ≈ σ_y / 3.3 (для сталей; грубо для остальных) ----
  const hardness = Math.round(sigmaY / 3.3);

  // ---- 5. Пластичность: обратно связана с прочностью ----
  const ductility = Math.max(1, Math.min(80, Math.round(70 - sigmaY * 0.08)));

  // ---- 6. PREN для сталей/никелевых ----
  const cr = comp.find(c => c.sym === "Cr")?.pct || 0;
  const mo = comp.find(c => c.sym === "Mo")?.pct || 0;
  const w  = comp.find(c => c.sym === "W")?.pct || 0;
  const nn = comp.find(c => c.sym === "N")?.pct || 0;  // если добавите N
  let corrosion;
  if (base === "Fe" || base === "Ni") {
    // PREN = Cr + 3.3(Mo + 0.5W) + 16N (для сталей/Ni-сплавов, N обычно мал)
    const pren = cr + 3.3 * (mo + 0.5 * w) + 16 * nn;
    corrosion = Math.max(0, Math.min(100, Math.round(pren * 1.2)));
  } else {
    // Для цветных — грубая оценка по легирующим
    const passivating = cr + (comp.find(c => c.sym === "Al")?.pct || 0) * 0.5
                          + (comp.find(c => c.sym === "Ti")?.pct || 0) * 0.8;
    corrosion = Math.max(5, Math.min(95, Math.round(30 + passivating * 1.5)));
  }

  // ---- 7. Электропроводность (оставляем как было) ----
  const conductivity = Math.round(comp.reduce((a,c)=>{
    const b = {Cu:100, Ag:105, Au:70, Al:62, Fe:17, Ni:14, Ti:2, W:30, Mo:35}[c.sym] ?? 20;
    return a + b * c.pct/100;
  },0));

  // ---- 8. Ликвация ----
  const seg = segregationSummary(comp);

  return {
    tm: Math.round(tm), rho: +rho.toFixed(2),
    hardness: Math.max(5, Math.min(100, hardness)),
    strength: Math.max(50, sigmaY),
    ductility: Math.max(1, Math.min(100, ductility)),
    corrosion: Math.max(0, Math.min(100, corrosion)),
    conductivity: Math.max(1, Math.min(105, conductivity)),
    components: n, mass: totalMass(),
    grainSize: Math.round(dGrain),
    pren: (base === "Fe" || base === "Ni") ? Math.round(cr + 3.3*(mo + 0.5*w) + 16*nn) : null,
    segregation: seg,
  };
}

function renderComposition(){
  const box = $("compList");
  const comp = composition();
  if (!comp.length){ box.innerHTML = `<div class="empty">Нет данных</div>`; return; }
  box.innerHTML = "";
  comp.forEach(c => {
    const m = metalBySym(c.sym);
    const row = document.createElement("div");
    row.className = "comp-row";
    row.innerHTML = `
      <div class="lbl"><span><b style="color:${m.hi}">${c.sym}</b> ${m.name}</span><span style="color:var(--muted)">${c.pct.toFixed(1)}%</span></div>
      <div class="bar"><i style="width:${c.pct}%;background:linear-gradient(90deg,${m.lo},${m.base},${m.hi})"></i></div>`;
    box.appendChild(row);
  });
}
function renderProps(){
  const box = $("propList");
  const comp = composition();
  const id = identifyAlloy(comp);
  const p = S.ingot ? S.ingot.props : alloyProps();
  if (!p){ box.innerHTML = `<div class="empty">—</div>`; return; }
  const rows = [];
  if (id) rows.push(["Название", id.name, "name-prop"]);
  if (id && id.cat) rows.push(["Тип", id.cat]);
  rows.push(
    ["Масса", p.mass + " г"],
    ["Компонентов", p.components],
    ["T ликвидуса", p.tm + " °C"],
    ["Плотность", p.rho + " г/см³"],
    ["Зерно (оценка)", p.grainSize + " мкм"],
    ["Твёрдость", p.hardness + " HV"],
    ["Прочность σ_y", p.strength + " МПа"],
    ["Пластичность", p.ductility + " %"],
  );
  if (p.pren !== null && p.pren !== undefined) {
    rows.push(["PREN", p.pren + (p.pren >= 40 ? " (высокий)" : p.pren >= 25 ? " (средний)" : " (низкий)")]);
  }
  rows.push(["Корроз. стойкость", p.corrosion + " %"]);
  rows.push(["Электропров.", p.conductivity + " %IACS"]);

  let html = rows.map(([k,v,cls]) => `<div class="prop ${cls||''}"><span>${k}</span><span>${v}</span></div>`).join("");

  // Ликвация: полоска обогащения
  if (p.segregation && p.segregation.enriched.length) {
    html += `<div style="margin-top:8px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px">Ликвация (остаточный расплав)</div>`;
    p.segregation.enriched.slice(0, 4).forEach(e => {
      const m = metalBySym(e.sym);
      if (!m) return;
      html += `<div class="prop"><span><b style="color:${m.hi}">${e.sym}</b></span><span style="color:var(--accent2)">×${e.ratio.toFixed(1)}</span></div>`;
    });
  }

  box.innerHTML = html;
}

function renderAdvanced(){
  const box = $("advList");
  const comp = composition();
  if (!comp.length){ box.innerHTML = `<div class="empty">—</div>`; return; }
  const p = alloyProps();
  const tp = alloyThermophys();
  const mag = magneticProps();
  const sh = shrinkage();
  const riser = p ? riserDesign(p.mass) : null;
  const gibbs = gibbsFreedom(comp.length, currentPhases());
  const im = intermetallics().slice(0, 4);
  const deox = deoxidation(1600).slice(0, 4);
  const warns = validateComposition();

  const row = (k,v) => `<div class="adv-row"><span>${k}</span><span>${v}</span></div>`;
  let html = "";

  html += `<div class="adv-title">Термофизика</div>`;
  html += row("Модуль E", tp.E.toFixed(1) + " ГПа");
  html += row("Коэф. Пуассона", tp.nu.toFixed(3));
  html += row("Теплоёмкость Cp", Math.round(tp.Cp) + " Дж/кг·К");
  html += row("Теплопроводность λ", tp.lam.toFixed(1) + " Вт/м·К");
  html += row("Температуропроводность a", tp.a.toFixed(2) + " мм²/с");
  html += row("Скрытая теплота L", Math.round(tp.L) + " кДж/кг");

  html += `<div class="adv-title">Магнитные (Кубо-Хонда)</div>`;
  if (mag && mag.ferro){
    html += row("Ферромагнитен", "да");
    html += row("Ms", mag.Ms + " Тл");
    html += row("Tc", mag.Tc + " K");
  } else html += row("Ферромагнитен", "нет");

  html += `<div class="adv-title">Усадка и прибыль</div>`;
  html += row("Объёмная усадка", sh.vol.toFixed(2) + " %");
  html += row("Линейная усадка", sh.lin.toFixed(2) + " %");
  if (riser){
    html += row("Модуль M", riser.M + " см");
    html += row("Прибыль D×H", riser.D + "×" + riser.H + " см");
    html += row("Раковина", riser.volCavity + " см³");
  }

  html += `<div class="adv-title">Термодинамика</div>`;
  html += row("Число фаз P", currentPhases());
  html += row("Степеней свободы F", gibbs);
  if (deox.length){
    html += row("Сильнейший раскислитель", deox[0].sym + " (ΔG=" + deox[0].dG.toFixed(0) + ")");
  }
  if (im.length){
    html += row("Интерметаллид", im[0].A + "-" + im[0].B + " Tпл≈" + im[0].tm + "°C");
  }
  if (warns.length){
    html += `<div class="adv-title" style="color:var(--accent2)">Предупреждения</div>`;
    warns.forEach(w => html += `<div class="adv-row"><span style="color:var(--accent2)">⚠</span><span style="font-size:10px">${w}</span></div>`);
  }
  box.innerHTML = html;
}

function updateResultCard(){
  const comp = composition();
  const card = $("resultCard");
  const shouldShow = comp.length > 0 && (S.melted || S.casted);
  if (!shouldShow){ card.classList.add("hidden"); return; }
  card.classList.remove("hidden");
  const id = identifyAlloy(comp);
  const p = S.ingot ? S.ingot.props : alloyProps();
  const tex = makeAlloyTexture(comp, 96);
  $("resPreview").style.backgroundImage = `url(${tex.toDataURL()})`;
  $("resName").textContent = id.name;
  $("resSub").textContent = `${id.cat} · ${S.casted ? "слиток" : "расплав"}`;
  $("resTm").textContent = `${p.tm} °C`;
}

function phaseName(){
  if (!S.charge.length) return "—";
  if (S.casted) return "Слиток";
  if (S.melted) return "Расплав";
  if (S.temp >= alloyTm()) return "Плавление";
  if (S.temp > alloyTm()*0.5) return "Нагрев";
  return "Твёрдое";
}
function updateHud(){
  $("hTemp").textContent = Math.round(S.temp) + " °C";
  $("hMass").textContent = totalMass() + " г";
  $("hPhase").textContent = phaseName();
  $("tempBig").textContent = Math.round(S.temp);
  $("phaseBig").textContent = phaseName();
  $("heatVal").textContent = Math.round(S.temp) + "°C";
  $("heat").value = Math.round(S.temp);
  let sub = "холодная";
  if (S.temp > 1000) sub = "высокая";
  if (S.temp > 2000) sub = "очень высокая";
  if (S.temp > 3000) sub = "экстремальная";
  $("tempSub").textContent = sub;
  const p = alloyProps();
  $("phaseSub").textContent = p ? `Tпл ≈ ${p.tm} °C` : "тигель пуст";
}
function recalcAll(){
  renderCharge(); renderComposition(); renderProps();
  renderAdvanced();
  updateHud(); updateResultCard(); draw();
}
function recalcPhase(){
  if (!S.charge.length){ S.melted = false; return; }
  const tm = alloyTm();
  if (S.temp >= tm) S.melted = true;
  if (S.temp < tm - 20) S.melted = false;
}

$("heat").oninput = e => {
  if (S.casted){ e.target.value = S.temp; return; }
  S.temp = +e.target.value; recalcPhase(); updateHud(); updateResultCard(); draw();
};
$("btnMelt").onclick = () => {
  if (!S.charge.length){ log("Тигель пуст.", "err"); return; }
  if (S.casted){ log("Слиток уже отлит.", "warn"); return; }
  S.temp = Math.round(alloyTm() + 80); recalcPhase();
  const comp = composition();
  const id = identifyAlloy(comp);
  log(`Нагрев до ${S.temp} °C. Получен расплав: ${id.name}.`, "ok");
  updateHud(); updateResultCard(); draw();

/* ============================================================
   13. CANVAS
   ============================================================ */
const cv = $("cv");
const ctx = cv.getContext("2d");
let W = 0, H = 0;
function resize(){
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, r.width * dpr);
  cv.height = Math.max(1, r.height * dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  W = r.width; H = r.height;
}
window.addEventListener("resize", () => { resize(); draw(); });

const rgb = (r,g,b,a=1) => `rgba(${r|0},${g|0},${b|0},${a})`;

function draw(){
  if (!W || !H) return;
  ctx.clearRect(0,0,W,H);

  const bg = ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#1a222c"); bg.addColorStop(1,"#080b0f");
  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = "#232c36"; ctx.lineWidth = 2;
  for (let i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(0, H*0.18 + i*H*0.2);
    ctx.lineTo(W, H*0.13 + i*H*0.21);
    ctx.stroke();
  }

  const cx = W/2;
  const cy = H*0.54;
  const tw = Math.min(W*0.55, H*0.8);
  const th = Math.min(H*0.55, W*0.55);

  if (S.temp > 200 && !S.casted){
    const heat = Math.min(1, (S.temp-200)/3000);
    const glow = ctx.createRadialGradient(cx, cy, 10, cx, cy, tw);
    glow.addColorStop(0, rgb(255, 120 - heat*80, 20, 0.22 + heat*0.5));
    glow.addColorStop(0.5, rgb(255, 70, 0, 0.15*heat));
    glow.addColorStop(1, "rgba(255,80,0,0)");
    ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);
  }

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx - tw/2, cy - th/2);
  ctx.lineTo(cx + tw/2, cy - th/2);
  ctx.lineTo(cx + tw/2 - tw*0.055, cy + th/2);
  ctx.quadraticCurveTo(cx, cy + th/2 + th*0.09, cx - tw/2 + tw*0.055, cy + th/2);
  ctx.closePath();
  const tg = ctx.createLinearGradient(cx - tw/2, 0, cx + tw/2, 0);
  tg.addColorStop(0, "#3a4450"); tg.addColorStop(0.35, "#4a5562");
  tg.addColorStop(0.6, "#2e3742"); tg.addColorStop(1, "#1c242c");
  ctx.fillStyle = tg; ctx.fill();
  ctx.strokeStyle = "#5a6878"; ctx.lineWidth = 3; ctx.stroke();
  ctx.restore();

  const inset = Math.max(6, tw*0.04);
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx - tw/2 + inset, cy - th/2 + inset);
  ctx.lineTo(cx + tw/2 - inset, cy - th/2 + inset);
  ctx.lineTo(cx + tw/2 - inset - tw*0.04, cy + th/2 - inset);
  ctx.quadraticCurveTo(cx, cy + th/2 - inset + th*0.05, cx - tw/2 + inset + tw*0.04, cy + th/2 - inset);
  ctx.closePath();
  ctx.clip();
  ctx.fillStyle = "#0a0d11";
  ctx.fillRect(cx - tw/2, cy - th/2, tw, th);

  const comp = composition();
  if (comp.length && !S.casted){
    const level = Math.min(0.85, 0.15 + comp.length * 0.06 + (totalMass()/2000)*0.3);
    const surfaceY = cy + th/2 - th*level;
    const isLiquid = S.melted || S.temp >= alloyTm();
    const col = mixBaseColor();
    if (isLiquid) drawLiquid(cx, tw, th, surfaceY, cy + th/2, col);
    else drawSolid(cx, tw, th, surfaceY, cy + th/2, comp);

    if (S.refined && isLiquid && Math.random() < 0.3){
      S.bubbles.push({
        x: cx - tw/2 + inset + Math.random()*(tw - inset*2),
        y: cy + th/2 - inset,
        r: 1 + Math.random()*3,
        vy: -0.5 - Math.random()*1.2, life: 1
      });
    }
    S.bubbles = S.bubbles.filter(b => b.life > 0);
    S.bubbles.forEach(b => {
      b.y += b.vy; b.life -= 0.012;
      ctx.globalAlpha = Math.max(0, b.life*0.9);
      const bg2 = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      bg2.addColorStop(0, "rgba(220,240,255,0.9)");
      bg2.addColorStop(0.6, "rgba(180,210,240,0.4)");
      bg2.addColorStop(1, "rgba(120,160,200,0)");
      ctx.fillStyle = bg2;
      ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  ctx.save();
  ctx.beginPath();
  ctx.moveTo(cx - tw/2, cy - th/2);
  ctx.lineTo(cx + tw/2, cy - th/2);
  ctx.strokeStyle = "#6a7888"; ctx.lineWidth = Math.max(3, tw*0.015); ctx.stroke();
  ctx.restore();

  if (S.temp > 800 && !S.casted) drawFlame(cx, cy, tw, th);
  if (S.casted && S.ingot) drawIngot(cx, cy, tw, th);

  ctx.fillStyle = "rgba(232,237,243,.5)";
  ctx.font = "11px Segoe UI"; ctx.textAlign = "center";
  ctx.fillText(S.casted ? "СЛИТОК" : "ИНДУКЦИОННАЯ ПЕЧЬ", cx, H - 8);
}

function drawLiquid(cx, tw, th, surfaceY, bottomY, col){
  const isHot = S.temp > 1200;
  const heat = Math.min(1, Math.max(0, (S.temp - 800)/2500));
  const left = cx - tw/2, right = cx + tw/2;
  const step = 4;

  const g = ctx.createLinearGradient(0, surfaceY, 0, bottomY);
  g.addColorStop(0, rgb(col.r+40, col.g+40, col.b+40));
  g.addColorStop(0.3, rgb(col.r, col.g, col.b));
  g.addColorStop(0.75, rgb(col.r-30, col.g-30, col.b-30));
  g.addColorStop(1, rgb(col.r-60, col.g-60, col.b-60));

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.moveTo(left, bottomY);
  ctx.lineTo(left, surfaceY);
  for (let x = 0; x <= tw; x += step){
    const y = surfaceY + Math.sin((x*0.045) + S.animPhase) * 3
              + Math.sin((x*0.11) + S.animPhase*1.7) * 1.6
              + Math.sin((x*0.02) - S.animPhase*0.7) * 2.2;
    ctx.lineTo(left + x, y);
  }
  ctx.lineTo(right, bottomY);
  ctx.closePath();
  ctx.fill();

  if (isHot){
    const hg = ctx.createLinearGradient(0, surfaceY, 0, surfaceY + th*0.5);
    hg.addColorStop(0, rgb(255, 180, 60, 0.45*heat));
    hg.addColorStop(0.5, rgb(255, 90, 20, 0.25*heat));
    hg.addColorStop(1, "rgba(255,50,0,0)");
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.moveTo(left, bottomY);
    ctx.lineTo(left, surfaceY);
    for (let x = 0; x <= tw; x += step){
      const y = surfaceY + Math.sin((x*0.045) + S.animPhase) * 3
                + Math.sin((x*0.11) + S.animPhase*1.7) * 1.6;
      ctx.lineTo(left + x, y);
    }
    ctx.lineTo(right, bottomY);
    ctx.closePath(); ctx.fill();
  }

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const hl = ctx.createRadialGradient(cx - tw*0.15, surfaceY + 4, 0, cx - tw*0.15, surfaceY + 4, tw*0.35);
  hl.addColorStop(0, "rgba(255,255,255,0.5)");
  hl.addColorStop(0.4, "rgba(255,255,255,0.15)");
  hl.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = hl;
  ctx.beginPath(); ctx.ellipse(cx - tw*0.15, surfaceY + 5, tw*0.3, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  ctx.strokeStyle = "rgba(255,255,255,0.35)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = 0; x <= tw; x += step){
    const y = surfaceY + Math.sin((x*0.045) + S.animPhase) * 3
              + Math.sin((x*0.11) + S.animPhase*1.7) * 1.6;
    if (x===0) ctx.moveTo(left + x, y); else ctx.lineTo(left + x, y);
  }
  ctx.stroke();

  if (S.temp > 1500 && Math.random() < 0.4){
    S.sparks.push({
      x: left + Math.random()*tw, y: surfaceY,
      vx: (Math.random()-0.5)*1.4, vy: -1 - Math.random()*2.2, life: 1
    });
  }
  S.sparks = S.sparks.filter(s => s.life > 0);
  S.sparks.forEach(s => {
    s.x += s.vx; s.y += s.vy; s.vy += 0.04; s.life -= 0.02;
    ctx.globalAlpha = Math.max(0, s.life);
    ctx.fillStyle = "#ffd27a";
    ctx.beginPath(); ctx.arc(s.x, s.y, 1, 0, Math.PI*2); ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function drawSolid(cx, tw, th, surfaceY, bottomY, comp){
  const g = ctx.createLinearGradient(0, surfaceY, 0, bottomY);
  g.addColorStop(0, "#1a1f26"); g.addColorStop(1, "#0a0d11");
  ctx.fillStyle = g;
  ctx.fillRect(cx - tw/2, surfaceY, tw, bottomY - surfaceY);

  const n = Math.min(40, comp.reduce((a,c)=>a+Math.ceil(c.mass/100),0));
  for (let i=0;i<n;i++){
    const m = metalBySym(comp[i%comp.length].sym);
    const tex = getMetalTexture(m.sym, 32);
    const px = cx - tw/2 + tw*0.06 + ((i*53)%(tw*0.85));
    const py = bottomY - 8 - ((i*37)%(th*0.55));
    const s = Math.max(10, Math.min(22, tw*0.06));
    ctx.save();
    ctx.translate(px, py);
    ctx.rotate((i%7)*0.4 - 0.6);
    ctx.fillStyle = "rgba(0,0,0,.5)";
    ctx.fillRect(-s/2 + 2, -s/2 + 2, s, s*0.7);
    ctx.drawImage(tex, -s/2, -s/2, s, s*0.7);
    ctx.restore();
  }
}

function drawFlame(cx, cy, tw, th){
  const intensity = Math.min(1, (S.temp-800)/2700);
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (let i=0;i<14;i++){
    const fx = cx - tw/2 + Math.random()*tw;
    const fy = cy - th/2 - Math.random()*40*intensity;
    const r = 6 + Math.random()*16;
    const g = ctx.createRadialGradient(fx, fy, 1, fx, fy, r);
    const hue = 40 - intensity*30;
    g.addColorStop(0, `hsla(${hue}, 100%, 70%, ${0.5*intensity})`);
    g.addColorStop(0.4, `hsla(${hue-10}, 100%, 55%, ${0.22*intensity})`);
    g.addColorStop(1, `hsla(${hue-20}, 100%, 50%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(fx, fy, r, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawIngot(cx, cy, tw, th){
  const w = tw*0.6, h = th*0.5;
  const x = cx - w/2, y = cy - h/2;
  const col = mixBaseColor();
  const topH = Math.max(10, h*0.14);

  ctx.fillStyle = "rgba(0,0,0,.45)";
  ctx.beginPath();
  ctx.ellipse(cx, y + h + 14, w*0.55, 9, 0, 0, Math.PI*2);
  ctx.fill();

  const topGrad = ctx.createLinearGradient(x, y - topH, x + w, y);
  topGrad.addColorStop(0, rgb(col.r+50, col.g+50, col.b+50));
  topGrad.addColorStop(1, rgb(col.r+10, col.g+10, col.b+10));
  ctx.fillStyle = topGrad;
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + w*0.15, y - topH);
  ctx.lineTo(x + w*0.85, y - topH); ctx.lineTo(x + w, y);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.25)"; ctx.lineWidth = 1; ctx.stroke();

  const fg = ctx.createLinearGradient(x, y, x + w, y + h);
  fg.addColorStop(0, rgb(col.r+30, col.g+30, col.b+30));
  fg.addColorStop(0.4, rgb(col.r, col.g, col.b));
  fg.addColorStop(0.75, rgb(col.r-35, col.g-35, col.b-35));
  fg.addColorStop(1, rgb(col.r-60, col.g-60, col.b-60));
  ctx.fillStyle = fg;
  ctx.fillRect(x, y, w, h);

  const sg = ctx.createLinearGradient(x + w, y, x + w*0.85, y + h);
  sg.addColorStop(0, rgb(col.r-20, col.g-20, col.b-20));
  sg.addColorStop(1, rgb(col.r-70, col.g-70, col.b-70));
  ctx.fillStyle = sg;
  ctx.beginPath();
  ctx.moveTo(x + w, y); ctx.lineTo(x + w*0.85, y - topH);
  ctx.lineTo(x + w*0.85, y + h - topH); ctx.lineTo(x + w, y + h);
  ctx.closePath(); ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.globalAlpha = 0.12;
  for (let i=0;i<60;i++){
    ctx.fillStyle = Math.random()>0.5 ? "#fff" : "#000";
    ctx.beginPath();
    ctx.arc(x + Math.random()*w, y + Math.random()*h, 0.6 + Math.random()*1.4, 0, Math.PI*2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.lineWidth = 0.6;
  for (let i=0;i<8;i++){
    const sx = x + Math.random()*w, sy = y + Math.random()*h;
    ctx.beginPath(); ctx.moveTo(sx, sy);
    ctx.lineTo(sx + (Math.random()-0.5)*30, sy + (Math.random()-0.5)*15);
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  const hg = ctx.createRadialGradient(x + w*0.3, y + h*0.25, 0, x + w*0.3, y + h*0.25, w*0.4);
  hg.addColorStop(0, "rgba(255,255,255,0.5)");
  hg.addColorStop(0.4, "rgba(255,255,255,0.1)");
  hg.addColorStop(1, "rgba(255,255,255,0)");
  ctx.fillStyle = hg; ctx.fillRect(x, y, w, h);
  ctx.restore();

  if (S.ingot && S.ingot.name){
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.font = `bold ${Math.max(11, Math.min(16, w*0.055))}px Segoe UI`;
    ctx.textAlign = "center";
    ctx.fillText(S.ingot.name, x + w/2, y + h*0.55);
    ctx.fillStyle = "rgba(0,0,0,.45)";
    ctx.font = `bold ${Math.max(8, Math.min(11, w*0.04))}px Consolas`;
    ctx.fillText("СПЛАВ", x + w/2, y + h*0.55 + Math.max(10, w*0.045));
  }
  ctx.strokeStyle = "rgba(0,0,0,0.4)"; ctx.lineWidth = 1;
  ctx.strokeRect(x, y, w, h);
}

(function blockZoomAndSelection(){
  // 1. Запрет пинч-зума (iOS Safari + Android)
  document.addEventListener('gesturestart', e => e.preventDefault(), { passive: false });
  document.addEventListener('gesturechange', e => e.preventDefault(), { passive: false });
  document.addEventListener('gestureend', e => e.preventDefault(), { passive: false });

  // 2. Запрет мультитач-зума через touch
  document.addEventListener('touchmove', e => {
    if (e.touches.length > 1) e.preventDefault();
  }, { passive: false });

  // 3. Запрет двойного тапа-зума
  let lastTouchEnd = 0;
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) e.preventDefault();
    lastTouchEnd = now;
  }, { passive: false });

  // 4. Запрет Ctrl+колесо (зум в браузере) и Ctrl+«+/-/0»
  window.addEventListener('wheel', e => {
    if (e.ctrlKey) e.preventDefault();
  }, { passive: false });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && ['+', '-', '=', '0'].includes(e.key)) {
      e.preventDefault();
    }
  });

  // 5. Запрет выделения через drag (mousedown + move)
  document.addEventListener('mousedown', e => {
    // не мешаем полям ввода и кнопкам
    if (e.target.closest('input, textarea, button, [contenteditable="true"]')) return;
    if (e.detail > 1) e.preventDefault(); // двойной/тройной клик
  });

  // 6. Запрет контекстного меню на canvas и картинках (по желанию)
  document.querySelectorAll('canvas, .thumb, .preview').forEach(el => {
    el.addEventListener('contextmenu', e => e.preventDefault());
  });

  // 7. Запрет выделения «протяжкой» мышью (Safari/Chrome fallback)
  document.addEventListener('selectstart', e => {
    if (!e.target.closest('input, textarea, [contenteditable="true"]')) {
      e.preventDefault();
    }
  });
})();
