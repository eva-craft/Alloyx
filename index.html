// Целевой состав рецепта: base + легирующие, всего 100%.
// Берём середину диапазона каждого правила; если сумма > 100 — нормируем.
function recipeTargets(alloy){
  const entries = Object.entries(alloy.rules)
    .filter(([sym]) => metalBySym(sym))           // <-- фильтр неизвестных
    .map(([sym, [min, max]]) => {
      let mid = (min + max) / 2;
      if (alloy.virtual && alloy.virtual[sym] !== undefined) mid = alloy.virtual[sym];
      return { sym, min, max, pct: mid };
    });
  const sum = entries.reduce((a, e) => a + e.pct, 0);
  if (sum > 0) entries.forEach(e => { e.pct = e.pct / sum * 100; });
  entries.forEach(e => { e.pct = Math.round(e.pct * 10) / 10; });
  const diff = +(100 - entries.reduce((a, e) => a + e.pct, 0)).toFixed(1);
  if (entries.length) entries[0].pct = +(entries[0].pct + diff).toFixed(1);
  return entries;
}

// Граммы на 100 г шихты
function recipeGrams(entries, totalG = 100){
  return entries.map(e => ({
    ...e,
    g: Math.round(e.pct / 100 * totalG * 1000) / 1000
  }));
}

let recipeFilter = "";

function renderRecipeList(){
  const list = $("recipeList");
  const q = recipeFilter.trim().toLowerCase();
  const items = ALLOYS
    .map(a => ({ a, base: metalBySym(a.base) }))
    .filter(x => x.base) // <-- добавляем проверку
    .filter(x => {
      if (!q) return true;
      const hay = (x.a.name + " " + x.a.cat + " " + x.a.base + " " + x.base.name).toLowerCase();
      return hay.includes(q);
    })
    .sort((x, y) => x.a.name.localeCompare(y.a.name, "ru"));
  list.innerHTML = "";
  if (!items.length){
    list.innerHTML = `<div class="empty">Ничего не найдено</div>`;
    return;
  }
  items.forEach(({ a }) => {
    const el = document.createElement("div");
    el.className = "recipe-item";
    el.dataset.name = a.name;
    el.innerHTML = `${a.name}<small>${a.cat} · основа ${metalBySym(a.base).name} (${a.base})</small>`;
    el.onclick = () => selectRecipe(a.name);
    list.appendChild(el);
  });
}

let currentRecipeName = null;

function selectRecipe(name){
  currentRecipeName = name;
  document.querySelectorAll(".recipe-item").forEach(el => {
    el.classList.toggle("active", el.dataset.name === name);
  });
  renderRecipeDetail(name);
}

function renderRecipeDetail(name){
  const box = $("recipeDetail");
  const alloy = ALLOYS.find(a => a.name === name);
  if (!alloy){ box.innerHTML = `<div class="empty">Сплав не найден</div>`; return; }

  const baseMetal = metalBySym(alloy.base);
  const targets = recipeTargets(alloy);
  const grams = recipeGrams(targets, 100);

  const totalMass = 100; // г на порцию
const rows = grams.map(e => {
  const m = metalBySym(e.sym);
  if (!m) return ''; // <-- если металл не найден, пропускаем строку
  const isBase = e.sym === alloy.base;
  const range = `${e.min}–${e.max}%`;
  return `<tr class="${isBase ? 'base-row' : ''}">
    <td class="sym">${e.sym}</td>
    <td>${m.name}${isBase ? ' <span style="color:var(--muted);font-size:10px">(основа)</span>' : ''}</td>
    <td class="num">${e.pct.toFixed(1)}%</td>
    <td class="num" style="color:var(--muted)">${range}</td>
    <td class="num" style="color:var(--cool)">${e.g.toFixed(3)} г</td>
  </tr>`;
}).join('');

  box.innerHTML = `
    <div class="title">${alloy.name}</div>
    <div class="sub">${alloy.cat} · основа ${baseMetal.name} (${alloy.base})</div>
    <span class="badge">Порция: ${totalMass} г</span>
    <span class="badge">Компонентов: ${grams.length}</span>
    <span class="badge">Tпл ≈ ${Math.round(alloyTmFor(alloy))} °C</span>

    <table class="recipe-table">
      <thead>
        <tr>
          <th>Символ</th><th>Металл</th>
          <th style="text-align:right">Цель, %</th>
          <th style="text-align:right">Допуск</th>
          <th style="text-align:right">Масса на 100 г</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>

    <div class="recipe-actions">
      <button class="btn-primary" id="recipeLoad100">Загрузить в тигель (100 г)</button>
      <button class="btn-cast" id="recipeLoad500">Загрузить 500 г</button>
      <button class="btn-clean" id="recipeLoadCustom">Своя масса…</button>
    </div>
    <div class="recipe-note">
      Кнопки заполняют шихту указанной массой (граммы рассчитаны из целевых процентов,
      округление до 0.001 г). После загрузки можно менять массы вручную — проценты
      пересчитаются автоматически. Если в текущем тигле уже есть металлы, они будут
      заменены.
    </div>
  `;

  $("recipeLoad100").onclick = () => loadRecipeToCharge(alloy, 100);
  $("recipeLoad500").onclick = () => loadRecipeToCharge(alloy, 500);
  $("recipeLoadCustom").onclick = () => {
    const v = prompt("Введите общую массу шихты, г:", "250");
    if (v === null) return;
    const m = parseMass(v);
    if (m === null || m <= 0 || m > 100000){
      log("Некорректная масса.", "err");
      return;
    }
    loadRecipeToCharge(alloy, m);
  };
}

// Оценка Tпл для рецепта (для бейджа) — та же формула, что в alloyTm
function alloyTmFor(alloy){
  const entries = recipeTargets(alloy); // уже отфильтрованы
  let tm = 0;
  entries.forEach(e => {
    const m = metalBySym(e.sym);
    if (m) tm += m.tm * e.pct / 100;
  });
  const n = entries.length;
  const drop = Math.min(0.35, Math.max(0, (n - 1) * 0.06));
  return Math.max(20, tm * (1 - drop));
}

/* ============================================================
   ПРАВИЛО РЫЧАГА + БИНАРНАЯ ДИАГРАММА (упрощённая)
   ============================================================ */

// Упрощённая бинарная система с эвтектикой:
//   T_A, T_B — плавления компонентов
//   T_E, c_E — эвтектика (c_E — % B в эвтектике)
// Ликвидус: от A(0%) к T_E, затем от T_E к B(100%).
function binaryPhase(baseSym, alloySym, cE = 0.5, T_E = null, type="eutectic"){
  const mA = metalBySym(baseSym), mB = metalBySym(alloySym);
  if (!mA || !mB) return null;
  const TA = mA.tm, TB = mB.tm;
  const TE = T_E ?? (Math.min(TA,TB) * 0.6);
  const c = Math.max(0.02, Math.min(0.98, cE));
  return {TA, TB, TE, cE:c, type, baseSym, alloySym};
}

// Ликвидус при содержании c (доля B)
function liquidusT(diag, c){
  if (!diag) return null;
  const {TA, TB, TE, cE, type} = diag;
  if (type === "eutectic"){
    if (c <= cE) return TA + (TE - TA) * (c / cE);
    return TE + (TB - TE) * ((c - cE) / (1 - cE));
  }
  // перитектика — упрощённо как эвтектика (линейно)
  if (c <= cE) return TA + (TE - TA) * (c / cE);
  return TE + (TB - TE) * ((c - cE) / (1 - cE));
}
// Солидус (упрощённый, для эвтектики — горизонталь T_E при c<=cE, иначе линия до TB)
function solidusT(diag, c){
  if (!diag) return null;
  const {TB, TE, cE, type} = diag;
  if (type === "eutectic"){
    if (c <= cE) return TE;
    return TE + (TB - TE) * ((c - cE) / (1 - cE));
  }
  return TE;
}

// Правило рычага: доли твёрдой/жидкой фаз при T в двухфазной области
// C0 — общий состав (% B), C_S и C_L — составы твёрдой и жидкой фаз
function leverRule(C0, C_S, C_L){
  if (C_L === C_S) return {fSolid:0, fLiquid:1};
  const fL = (C0 - C_S) / (C_L - C_S);
  return {fSolid: 1 - fL, fLiquid: fL};
}

// Для данной пары (base, alloy) и общего состава C0 найти C_S и C_L при T
function phaseFractionsAtT(baseSym, alloySym, C0, T){
  const diag = binaryPhase(baseSym, alloySym);
  if (!diag) return null;
  const {TA,TB,TE,cE,type} = diag;
  const Tl = liquidusT(diag, C0);
  const Ts = solidusT(diag, C0);
  if (T >= Tl) return {fSolid:0, fLiquid:1, C_S:null, C_L:C0, T, Tl, Ts};
  if (T <= Ts) return {fSolid:1, fLiquid:0, C_S:C0, C_L:null, T, Tl, Ts};
  // Двухфазная область
  if (type === "eutectic"){
    if (C0 <= cE){
      // между чистым A и эвтектикой: C_S ~ 0, C_L на ликвидусе
      const CS = 0;
      // состав жидкости из ликвидуса при T: c = cE*(TA - T)/(TA - TE)
      const CL = cE * (TA - T) / (TA - TE);
      const {fSolid, fLiquid} = leverRule(C0, CS, CL);
      return {fSolid, fLiquid, C_S:CS, C_L:CL, T, Tl, Ts};
    } else {
      // между эвтектикой и B
      const CS = cE;
      // жидкость при T: c = cE + (1-cE)*(T-TE)/(TB-TE)
      const CL = cE + (1-cE)*(T-TE)/(TB-TE);
      const {fSolid, fLiquid} = leverRule(C0, CS, CL);
      return {fSolid, fLiquid, C_S:CS, C_L:CL, T, Tl, Ts};
    }
  }
  return {fSolid:0.5, fLiquid:0.5, C_S:C0, C_L:C0, T, Tl, Ts};
}


/* ============================================================
   ПРАВИЛО ГИББСА (фазовое правило)
   F = C - P + 2  (или +1 при постоянном давлении)
   ============================================================ */
function gibbsFreedom(components, phases, constPressure = true){
  const C = Math.max(1, components);
  const P = Math.max(1, phases);
  return C - P + (constPressure ? 1 : 2);
}
// Определяем число фаз по состоянию системы
function currentPhases(){
  if (!S.charge.length) return 0;
  const comp = composition();
  if (S.casted) return 1; // слиток (одна фаза — твёрдый сплав, упрощённо)
  const tm = alloyTm();
  if (S.temp >= tm) return 1;           // расплав
  if (S.temp < tm * 0.4) return 1;      // твёрдое
  return 2;                              // двухфазная зона
}

/* ============================================================
   НЕДОСТАЮЩИЕ ФУНКЦИИ (усадка, Аррениус, Кубо-Хонда,
   Нордгейм, раскисление, обратная шихта, термообработка)
   ============================================================ */

// Вязкость расплава (Па·с), усреднённо
const MU_LIQ = 5e-3;

/* ---------- УСАДКА ---------- */
function shrinkage(){
  const comp = composition();
  if (!comp.length) return {vol:0, lin:0};
  let sum = 0;
  comp.forEach(c => {
    const m = metalBySym(c.sym);
    const s = Math.max(0.02, Math.min(0.10, 0.03 + m.tm / 50000));
    sum += s * c.pct / 100;
  });
  const vol = sum * 100;
  return {vol, lin: vol / 3};
}
function shrinkageCavity(mass_g, shrink_pct){
  const volMetal = mass_g / 8.0;
  return volMetal * shrink_pct / 100;
}
function feedingDistance(k_permeability = 1e-10, dP = 1e4, eps_v = 0.05){
  return Math.sqrt(2 * k_permeability * dP / (MU_LIQ * Math.max(1e-4, eps_v/100)));
}

/* ---------- АРРЕНИУС ---------- */
function arrheniusD(sym, T_K){
  const d = DIFF[sym] || DIFF.default;
  return d.D0 * Math.exp(-d.Q * 1000 / (R_GAS * Math.max(1, T_K)));
}
function grainGrowth(d0_um, T_K, t_s, baseSym = "Fe"){
  const d = DIFF[baseSym] || DIFF.default;
  const k0 = 1e-3;
  const k = k0 * Math.exp(-d.Q * 1000 / (R_GAS * Math.max(1, T_K)));
  const d2 = d0_um * d0_um + k * t_s;
  return Math.sqrt(Math.max(d0_um*d0_um, d2));
}
function temperingHardness(H0, T_C, t_s, alloyBase="Fe"){
  if (T_C < 100) return H0;
  const T_K = T_C + 273.15;
  const d = DIFF[alloyBase] || DIFF.default;
  const k = 1e-2 * Math.exp(-d.Q * 1000 / (R_GAS * T_K));
  const Hmin = Math.max(5, H0 * 0.3);
  const drop = (H0 - Hmin) * (1 - Math.exp(-k * t_s / 60));
  return Math.max(Hmin, H0 - drop);
}
function diffusionRate(sym, T_C){
  return arrheniusD(sym, T_C + 273.15);
}

/* ---------- КУБО-ХОНДА ---------- */
const MAG = {
  Fe:{Ms:2.2, Tc:1043, mu:2.22},
  Ni:{Ms:0.62, Tc:631,  mu:0.60},
  Co:{Ms:1.79, Tc:1393, mu:1.72},
  Gd:{Ms:2.0, Tc:293, mu:7.1},
  default:{Ms:0, Tc:0, mu:0}
};
function magneticProps(){
  const comp = composition();
  if (!comp.length) return null;
  let Ms=0, Tc=0, totalMag=0;
  comp.forEach(c => {
    const m = MAG[c.sym] || MAG.default;
    if (m.Ms > 0){
      const w = c.pct/100;
      Ms += m.Ms * w;
      Tc += m.Tc * w;
      totalMag += w;
    }
  });
  if (totalMag === 0) return {ferro:false, Ms:0, Tc:0};
  Ms /= totalMag;
  Tc /= totalMag;
  return {ferro:true, Ms: +Ms.toFixed(2), Tc: Math.round(Tc), fraction: +totalMag.toFixed(2)};
}

/* ---------- НОРДГЕЙМ ---------- */
function nordheimTm(symA, symB, cA = 0.5, cB = 0.5){
  const mA = metalBySym(symA), mB = metalBySym(symB);
  if (!mA || !mB) return null;
  const Tm = (mA.tm + mB.tm) / 2;
  const K = NORDHEIM_K * 100;
  return Math.max(20, Tm + K * Math.sqrt(cA * cB));
}
function intermetallics(){
  const comp = composition();
  if (!comp.length) return [];
  const res = [];
  for (let i=0;i<comp.length;i++){
    for (let j=i+1;j<comp.length;j++){
      const a = comp[i], b = comp[j];
      const cA = a.pct/100, cB = b.pct/100;
      if (a.pct < 1 || b.pct < 1) continue;
      const tm = nordheimTm(a.sym, b.sym, cA, cB);
      res.push({A:a.sym, B:b.sym, tm:Math.round(tm)});
    }
  }
  return res.sort((x,y)=>y.tm-x.tm);
}

/* ---------- РАСКИСЛЕНИЕ ---------- */
function deoxidation(T_C = 1600){
  const T_K = T_C + 273.15;
  const rows = [];
  for (const [sym, r] of Object.entries(DEOX_REACTIONS)){
    const dG = r.A + r.B * T_K;
    rows.push({sym, name:r.name, dG});
  }
  rows.sort((a,b)=>a.dG-b.dG);
  return rows;
}
function equilibriumO(sym, T_C, me_pct){
  const r = DEOX_REACTIONS[sym];
  if (!r) return null;
  const T_K = T_C + 273.15;
  const dG = r.A + r.B * T_K;
  const Keq = Math.exp(-dG * 1000 / (R_GAS * T_K));
  return Math.max(0.001, 1e6 / (Keq * Math.max(0.01, me_pct)));
}

/* ---------- ОБРАТНАЯ ШИХТА ---------- */
function inverseCharge(targets, totalG = 100){
  const syms = Object.keys(targets).filter(s => metalBySym(s) && targets[s] > 0);
  const sum = syms.reduce((a,s)=>a+targets[s],0);
  if (sum <= 0) return null;
  return syms.map(s => ({
    sym: s,
    mass: +(targets[s] / sum * totalG).toFixed(3)
  }));
}

/* ---------- ТЕРМООБРАБОТКА ---------- */
function baseHardnessHV(){
  const p = alloyProps();
  return p ? p.hardness : 0;
}
function quenchHardness(H0, T_quench_C, baseSym="Fe"){
  const factor = Math.min(2.0, 1 + (T_quench_C - 800) / 1200);
  return Math.round(Math.max(H0, H0 * factor));
}
function temperHardness(H_quench, T_C, t_min, baseSym="Fe"){
  return Math.round(temperingHardness(H_quench, T_C, t_min*60, baseSym));
}
function normalizeHardness(H0, T_C = 900){
  return Math.round(H0 * (0.95 + 0.001 * T_C));
}
function agingHardness(H0, T_C, t_min, baseSym="Al"){
  return Math.round(temperingHardness(H0, T_C, t_min*60, baseSym) * 1.1);
}
function heatTreatment(mode, T_C, t_min){
  const H0 = baseHardnessHV();
  const base = composition()[0]?.sym || "Fe";
  const results = [];
  if (mode === "quench"){
    results.push({step:"Закалка", T:T_C, H:quenchHardness(H0, T_C, base)});
    return results;
  }
  if (mode === "temper"){
    const Hq = quenchHardness(H0, 900, base);
    results.push({step:"Закалка", T:900, H:Hq});
    results.push({step:"Отпуск",  T:T_C, H:temperHardness(Hq, T_C, t_min, base)});
    return results;
  }
  if (mode === "normalize"){
    results.push({step:"Нормализация", T:T_C, H:normalizeHardness(H0, T_C)});
    return results;
  }
  if (mode === "age"){
    results.push({step:"Закалка",  T:T_C, H:quenchHardness(H0, T_C, base)});
    results.push({step:"Старение", T:T_C, H:agingHardness(H0, T_C, t_min, base)});
    return results;
  }
  return results;
}
function loadRecipeToCharge(alloy, totalG){
  if (S.casted){ log("Слиток уже отлит. Сбросьте печь (кнопка «Сброс»).", "warn"); return; }
  if (S.melted){ log("Расплав уже готов. Сбросьте печь, чтобы загрузить рецепт.", "warn"); return; }

  const targets = recipeTargets(alloy);
  const grams = recipeGrams(targets, totalG);

  // чистим тигель и заполняем заново
  S.charge = grams.map(e => ({
    sym: e.sym,
    mass: Math.max(0.001, Math.round(e.g * 1000) / 1000)
  }));

  log(`Рецепт «${alloy.name}» загружен: ${S.charge.length} компонентов, ${totalG} г.`, "ok");
  recalcAll();
  closeRecipeModal();
}

/* ============================================================
   ТЕПЛОФИЗИКА: аддитивные E, ν, Cp, λ, a, L
   ============================================================ */
function alloyThermophys(){
  const comp = composition();
  if (!comp.length) return {E:0, nu:0, Cp:1, lam:0, L:0, rho:0, a:0};
  let E=0, nu=0, Cp=0, lam=0, L=0, mass=0;
  comp.forEach(c => {
    const p = PHYS[c.sym] || PHYS.Fe;
    const w = c.pct/100;
    E  += p.E  * w;
    nu += p.nu * w;
    Cp += p.Cp * w;
    lam+= p.lam* w;
    L  += p.L  * w;
    mass += p.rho * w;
  });
  const rho = alloyDensity() || mass || 1;
  const a = (lam / (rho * 1000 * Math.max(1, Cp))) * 1e6; // мм²/с
  return {E, nu, Cp, lam, L, rho, a};
}

  $("recipeModal").classList.remove("hidden");

  }
}

$("btnRecipes").onclick = openRecipeModal;

init();
